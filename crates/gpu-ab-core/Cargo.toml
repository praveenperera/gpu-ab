[package]
name = "gpu-ab-core"
description = "Paired A/B timing of frozen GPU bench binaries with per-arm output checks"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "gpu_ab"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
eyre = "0.6.14"
glob = "0.3.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
statrs = "0.19.1"
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

# the Apple GPU probe: IOReport through CoreFoundation, and getloadavg
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8.7"
libc = "0.2.191"
